<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:22px;font-weight:700}.n{font-size:34px;font-weight:700;fill:#2563eb}.b{font-size:19px;fill:#475467}</style><text x="70" y="85" class="t">XGBoost Validation Results</text><text x="70" y="125" class="s">2026 Big Data Systems extension · candidate-ranking interpretation</text><g><rect x="70" y="205" width="190" height="245" rx="22" fill="#eff6ff" stroke="#93c5fd"/><rect x="285" y="205" width="190" height="245" rx="22" fill="#f8fafc" stroke="#d0d5dd"/><rect x="500" y="205" width="190" height="245" rx="22" fill="#fff7ed" stroke="#fdba74"/><rect x="715" y="205" width="190" height="245" rx="22" fill="#f8fafc" stroke="#d0d5dd"/><rect x="930" y="205" width="190" height="245" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/></g><text x="100" y="260" class="h">Accuracy</text><text x="100" y="340" class="n">0.7866</text><text x="315" y="260" class="h">Precision</text><text x="315" y="340" class="n">0.7518</text><text x="530" y="260" class="h">Recall</text><text x="530" y="340" class="n">0.1936</text><text x="745" y="260" class="h">F1</text><text x="745" y="340" class="n">0.3079</text><text x="960" y="260" class="h">ROC-AUC</text><text x="960" y="340" class="n">0.6531</text><text x="70" y="525" class="b">Low recall indicates that hard classification is not sufficient for deployment decisions.</text><text x="70" y="565" class="b">The project therefore uses predicted probability as a screening/ranking signal and combines it with spatial review.</text><text x="70" y="620" class="s">Metrics are reported from the 2026 final report; the earlier ML-course prototype is treated as a separate experiment stage.</text></svg>