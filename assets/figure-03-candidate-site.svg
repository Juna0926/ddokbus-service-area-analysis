<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:24px;font-weight:700}.b{font-size:20px;fill:#475467}</style><text x="70" y="85" class="t">Final Candidate Review</text><text x="70" y="125" class="s">A high model probability is only one part of the service-area decision</text><circle cx="300" cy="350" r="155" fill="#eff6ff" stroke="#93c5fd"/><text x="225" y="320" class="h">Model signal</text><text x="215" y="365" class="b">Predicted probability</text><text x="225" y="402" class="b">relative ranking</text><circle cx="600" cy="350" r="155" fill="#f5f3ff" stroke="#c4b5fd"/><text x="505" y="320" class="h">Spatial context</text><text x="505" y="365" class="b">Distance to current zones</text><text x="515" y="402" class="b">neighboring clusters</text><circle cx="900" cy="350" r="155" fill="#ecfdf3" stroke="#86efac"/><text x="815" y="320" class="h">Real context</text><text x="820" y="365" class="b">Map / satellite review</text><text x="815" y="402" class="b">surrounding environment</text><text x="70" y="600" class="s">Candidate zones require operational demand, network feasibility, budget, and local-policy review before implementation.</text></svg>