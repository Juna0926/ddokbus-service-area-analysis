<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:24px;font-weight:700}.b{font-size:20px;fill:#475467}</style><text x="70" y="85" class="t">Spatial Candidate-Ranking Pipeline</text><text x="70" y="125" class="s">From grid-level public data to high-priority unserved DRT candidates</text><rect x="70" y="210" width="250" height="280" rx="24" fill="#eff6ff" stroke="#93c5fd"/><text x="105" y="265" class="h">1. 1 km × 1 km grids</text><text x="105" y="325" class="b">Senior population</text><text x="105" y="365" class="b">Medical / welfare</text><text x="105" y="405" class="b">Bus stops</text><text x="105" y="445" class="b">Businesses / factories</text><path d="M340 350H420" stroke="#2563eb" stroke-width="7"/><path d="M410 335l25 15-25 15" fill="#2563eb"/><rect x="435" y="210" width="250" height="280" rx="24" fill="#f5f3ff" stroke="#c4b5fd"/><text x="470" y="265" class="h">2. XGBoost</text><text x="470" y="325" class="b">Learn characteristics</text><text x="470" y="365" class="b">of served grids</text><text x="470" y="425" class="b">predict_proba</text><path d="M705 350H785" stroke="#2563eb" stroke-width="7"/><path d="M775 335l25 15-25 15" fill="#2563eb"/><rect x="800" y="210" width="330" height="280" rx="24" fill="#ecfdf3" stroke="#86efac"/><text x="835" y="265" class="h">3. Spatial screening</text><text x="835" y="325" class="b">High-probability unserved grids</text><text x="835" y="365" class="b">Neighboring high-score density</text><text x="835" y="405" class="b">Distance from existing zones</text><text x="835" y="445" class="b">Candidate clusters for review</text><text x="70" y="600" class="s">The model ranks candidates; it does not automatically designate real-world service zones.</text></svg>